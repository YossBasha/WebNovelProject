<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NextPage - Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- =============== TopBar ==================== -->
    <nav class="navbar navbar-expand-xl navbar-dark sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand fs-2 fw-bold" href="index.html">NextPage</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarBasic">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarBasic">
          <ul class="navbar-nav me-auto mb-2 mb-xl-0">
            <li class="nav-item">
              <a class="nav-link active" href="./library.html" id="personalLibraryLink" data-i18n="nav_library">Personal Library</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="discover.html" data-i18n="nav_discover">Discover</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="authors.html" data-i18n="nav_authors">Authors</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="#" data-bs-toggle="modal" data-bs-target="#contactModal" data-i18n="nav_contact">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="./about.html" data-i18n="nav_about">About</a>
            </li>
            <li class="nav-item sign-in ms-xl-auto" id="signInItem">
              <a class="nav-link active" href="#" data-bs-toggle="modal" data-bs-target="#loginModal" data-i18n="nav_signin">Sign In</a>
            </li>
            <li class="nav-item" id="registerItem">
              <a class="nav-link active register-btn" href="#" data-bs-toggle="modal" data-bs-target="#registerModal" data-i18n="nav_register">Register</a>
            </li>

            <li class="nav-item dropdown d-none ms-xl-auto" id="userProfileItem">
              <a class="nav-link dropdown-toggle text-white d-flex align-items-center gap-2" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle fs-4"></i>
                <span class="fw-bold" data-i18n="nav_my_account">My Account</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
                <li><a class="dropdown-item" href="library.html" data-i18n="nav_library">Library</a></li>
                <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#settingsModal" data-i18n="nav_settings">Settings</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li><a class="dropdown-item text-danger" href="#" id="logoutBtn" data-i18n="nav_logout">Logout</a></li>
              </ul>
            </li>
          </ul>

          <form class="d-flex search-form-responsive mt-3 mt-xl-0" action="discover.html" method="GET">
            <div class="input-group">
              <input class="form-control" type="search" name="q" placeholder="Search novels..." aria-label="Search" data-i18n="search_placeholder" />
              <button class="btn btn-search" type="submit">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </nav>

    <!-- =============== Dashboard Layout ==================== -->
    <div class="container mt-5">
      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 mb-4">
          <div class="list-group rounded-4 shadow-sm" id="adminTabs" role="tablist">
            <a class="list-group-item list-group-item-action active bg-dark border-dark text-white p-3 fw-bold" id="users-tab" data-bs-toggle="list" href="#users" role="tab">
              <i class="bi bi-people-fill me-2 text-warning"></i> Manage Users
            </a>
            <!-- Could add more tabs here for novels, etc. -->
          </div>
        </div>

        <!-- Content Area -->
        <div class="col-md-9">
          <div class="tab-content" id="nav-tabContent">
            <!-- Users Tab -->
            <div class="tab-pane fade show active" id="users" role="tabpanel">
              <div class="card bg-secondary text-white border-0 shadow-sm rounded-4">
                <div class="card-header bg-dark border-bottom border-secondary p-4 d-flex justify-content-between align-items-center rounded-top-4">
                  <h4 class="mb-0 fw-bold"><i class="bi bi-person-lines-fill me-2 text-warning"></i>Users List</h4>
                </div>
                <div class="card-body p-0">
                  <div class="table-responsive">
                    <table class="table table-dark table-hover mb-0 align-middle">
                      <thead class="table-dark">
                        <tr>
                          <th class="px-4 py-3">ID</th>
                          <th class="px-4 py-3">Username</th>
                          <th class="px-4 py-3">Email</th>
                          <th class="px-4 py-3">Role</th>
                          <th class="px-4 py-3">Author ID</th>
                          <th class="px-4 py-3">Actions</th>
                        </tr>
                      </thead>
                      <tbody id="usersTableBody">
                        <!-- Populated dynamically -->
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Role Modal -->
    <div class="modal fade" id="editRoleModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white border-secondary">
          <div class="modal-header border-secondary">
            <h5 class="modal-title">Edit User Role</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <form id="editRoleForm">
              <input type="hidden" id="editUserId" />
              <div class="mb-3">
                <label class="form-label text-white-50">Username</label>
                <input type="text" class="form-control bg-secondary text-white border-0" id="editUsername" readonly />
              </div>
              <div class="mb-3">
                <label class="form-label text-warning fw-bold">Role</label>
                <select class="form-select bg-secondary text-white border-0" id="editRoleSelect">
                  <option value="User">User</option>
                  <option value="Author">Author</option>
                  <option value="Admin">Admin</option>
                </select>
              </div>
              <div class="mb-3" id="authorIdGroup">
                <label class="form-label text-warning fw-bold">Author ID (Optional, map to Authors table)</label>
                <input type="number" class="form-control bg-secondary text-white border-0" id="editAuthorId" placeholder="e.g. 1" />
              </div>
              <button type="submit" class="btn btn-warning w-100 fw-bold">Save Changes</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
    <script src="js/admin_dashboard.js"></script>
  </body>
</html>
