<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NextPage - Author Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- =============== TopBar ==================== -->
    <nav class="navbar navbar-expand-xl navbar-dark sticky-top">
      <div class="container-fluid">
        <a class="navbar-brand fs-2 fw-bold" href="index.html">NextPage</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarBasic">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarBasic">
          <ul class="navbar-nav me-auto mb-2 mb-xl-0">
            <li class="nav-item">
              <a class="nav-link active" href="./library.html" id="personalLibraryLink" data-i18n="nav_library">Personal Library</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="discover.html" data-i18n="nav_discover">Discover</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="authors.html" data-i18n="nav_authors">Authors</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="#" data-bs-toggle="modal" data-bs-target="#contactModal" data-i18n="nav_contact">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="./about.html" data-i18n="nav_about">About</a>
            </li>
            <li class="nav-item sign-in ms-xl-auto" id="signInItem">
              <a class="nav-link active" href="#" data-bs-toggle="modal" data-bs-target="#loginModal" data-i18n="nav_signin">Sign In</a>
            </li>
            <li class="nav-item" id="registerItem">
              <a class="nav-link active register-btn" href="#" data-bs-toggle="modal" data-bs-target="#registerModal" data-i18n="nav_register">Register</a>
            </li>

            <li class="nav-item dropdown d-none ms-xl-auto" id="userProfileItem">
              <a class="nav-link dropdown-toggle text-white d-flex align-items-center gap-2" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="bi bi-person-circle fs-4"></i>
                <span class="fw-bold" data-i18n="nav_my_account">My Account</span>
              </a>
              <ul class="dropdown-menu dropdown-menu-end dropdown-menu-dark">
                <li><a class="dropdown-item" href="library.html" data-i18n="nav_library">Library</a></li>
                <li><a class="dropdown-item" href="#" data-bs-toggle="modal" data-bs-target="#settingsModal" data-i18n="nav_settings">Settings</a></li>
                <li><hr class="dropdown-divider" /></li>
                <li><a class="dropdown-item text-danger" href="#" id="logoutBtn" data-i18n="nav_logout">Logout</a></li>
              </ul>
            </li>
          </ul>

          <form class="d-flex search-form-responsive mt-3 mt-xl-0" action="discover.html" method="GET">
            <div class="input-group">
              <input class="form-control" type="search" name="q" placeholder="Search novels..." aria-label="Search" data-i18n="search_placeholder" />
              <button class="btn btn-search" type="submit">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </form>
        </div>
      </div>
    </nav>

    <!-- =============== Dashboard Layout ==================== -->
    <div class="container mt-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-white"><i class="bi bi-pencil-square me-2 text-warning"></i>Author Dashboard</h2>
        <button class="btn btn-warning fw-bold px-4 rounded-pill" data-bs-toggle="modal" data-bs-target="#newNovelModal">
          <i class="bi bi-plus-lg me-1"></i> New Novel
        </button>
      </div>

      <div class="row" id="authorNovelsContainer">
        <!-- Populated dynamically -->
      </div>
    </div>

    <!-- New Novel Modal -->
    <div class="modal fade" id="newNovelModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-dark text-white border-secondary rounded-4">
          <div class="modal-header border-secondary rounded-top-4">
            <h5 class="modal-title fw-bold text-warning">Upload New Novel</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4">
            <form id="newNovelForm">
              <div class="mb-3">
                <label class="form-label text-white-50">Title</label>
                <input type="text" class="form-control bg-secondary text-white border-0" id="novelTitle" required />
              </div>
              <div class="mb-3">
                <label class="form-label text-white-50">Description</label>
                <textarea class="form-control bg-secondary text-white border-0" id="novelDesc" rows="4" required></textarea>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label text-white-50">Price ($)</label>
                  <input type="number" step="0.01" class="form-control bg-secondary text-white border-0" id="novelPrice" value="0.00" required />
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label text-white-50">Cover Image Path</label>
                  <input type="text" class="form-control bg-secondary text-white border-0" id="novelImage" placeholder="e.g. imgs/novel1.webp" />
                </div>
              </div>
              <div class="mb-4">
                <label class="form-label text-white-50">Categories (Hold Ctrl to select multiple)</label>
                <select multiple class="form-select bg-secondary text-white border-0" id="novelCategories">
                </select>
              </div>
              <button type="submit" class="btn btn-warning w-100 fw-bold py-2">Publish Novel</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/script.js"></script>
    <script src="js/author_dashboard.js"></script>
  </body>
</html>
